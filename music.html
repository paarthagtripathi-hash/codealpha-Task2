<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="player-container">
    <!-- Album Artwork -->
    <div class="artwork-wrapper">
      <img id="cover" src="https://picsum.photos/id/10/300/300" alt="Album Cover">
    </div>

    <!-- Song Info -->
    <div class="song-info">
      <h2 id="title">Song Title</h2>
      <h3 id="artist">Artist Name</h3>
    </div>

    <!-- Audio Element -->
    <audio id="audio"></audio>

    <!-- Progress Bar -->
    <div class="progress-section">
      <div class="time-display">
        <span id="current-time">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <div class="progress-bar-wrapper" id="progress-container">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Controls (Play, Prev, Next) -->
    <div class="controls">
      <button class="control-btn" id="prev-btn" title="Previous">&#9198;</button>
      <button class="control-btn play-main" id="play-btn" title="Play">&#9658;</button>
      <button class="control-btn" id="next-btn" title="Next">&#9197;</button>
    </div>

    <!-- Volume Control -->
    <div class="volume-container">
      <span>&#128266;</span>
      <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.7">
    </div>

    <!-- Playlist (Bonus Feature) -->
    <div class="playlist-container">
      <h4>Playlist</h4>
      <ul id="playlist"></ul>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>9+9+9+9+9+9+9+
